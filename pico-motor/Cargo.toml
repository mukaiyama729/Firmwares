[package]
name = "pico-motor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

# Independent embedded workspace so host builds never target the RP2350.
[workspace]

[dependencies]
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }
embedded-hal = "1.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
robot-protocol = { path = "../../protocol" }
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
] }
embassy-rp = { version = "0.10.0", features = [
  "rp235xa",
  "time-driver",
  "critical-section-impl",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
static_cell = "2.1.1"
embassy-usb = "0.6.0"
heapless = "0.9.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[build]
target = "thumbv8m.main-none-eabihf"
